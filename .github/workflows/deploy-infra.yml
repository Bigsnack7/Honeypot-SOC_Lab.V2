name: Deploy Honeypot Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Generate Parameters File
        run: |
          cat <<EOF > params.json
          {
            "adminPassword": { "value": "$ADMIN_PASSWORD" },
            "sshPublicKey": { "value": "$SSH_PUBLIC_KEY" }
          }
          EOF
        env:
          ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
          SSH_PUBLIC_KEY: ${{ secrets.VM_SSH_PUBLIC_KEY }}

      - name: Deploy Base Infrastructure via Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          region: centralus
          template: ./infra/main.bicep
          deploymentName: main-${{ github.run_id }}
          parameters: params.json

