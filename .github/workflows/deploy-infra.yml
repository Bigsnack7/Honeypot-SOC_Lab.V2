name: Deploy Honeypot Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**' # Triggers when infrastructure files change

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Test Connection
        run: |
          echo "Successfully authenticated to Azure! Pipeline connection is verified."
