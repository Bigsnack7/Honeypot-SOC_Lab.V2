name: Deploy Honeypot Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Show Active Account
        run: |
          FULL_ID=$(az account show --query "user.name" -o tsv)
          echo "Last 8 characters of client ID: ${FULL_ID: -8}"

      - name: Generate Parameters File
        run: |
          cat <<EOF > params.json
          {
            "adminPassword": { "value": "$ADMIN_PASSWORD" },
            "sshPublicKey": { "value": "$SSH_PUBLIC_KEY" },
            "alertEmail": { "value": "$ALERT_EMAIL" },
            "allowProvisioningEgress": { "value": false },
            "sentinelPrincipalId": { "value": "$SENTINEL_PRINCIPAL_ID" }
          }
          EOF
        env:
          ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
          SSH_PUBLIC_KEY: ${{ secrets.VM_SSH_PUBLIC_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SENTINEL_PRINCIPAL_ID: ${{ secrets.SENTINEL_PRINCIPAL_ID }}

      - name: Debug Parameters File
        run: cat params.json

      - name: Validate Bicep Template
        run: |
          az deployment sub validate \
            --location centralus \
            --template-file ./infra/main.bicep \
            --parameters params.json

      - name: Deploy Base Infrastructure via Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          region: centralus
          template: ./infra/main.bicep
          deploymentName: main-${{ github.run_id }}
          parameters: params.json
          failOnStdErr: false
