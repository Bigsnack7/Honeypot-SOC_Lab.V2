#cloud-config
runcmd:
  # Wait for any background apt lock (e.g. unattended-upgrades) to clear
  - |
    for i in $(seq 1 30); do
      if sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then
        sleep 10
      else
        break
      fi
    done
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y python3-pip python3-venv libssl-dev libffi-dev build-essential libpython3-dev python3-minimal authbind
  - useradd -m -s /bin/bash cowrie
  - mkdir -p /etc/authbind/byport
  - touch /etc/authbind/byport/22
  - chown cowrie:cowrie /etc/authbind/byport/22
  - chmod 770 /etc/authbind/byport/22
  - mkdir -p /etc/ssh/sshd_config.d
  - echo "Port 2222" > /etc/ssh/sshd_config.d/99-honeypot.conf
  - systemctl restart sshd
  - su - cowrie -c "mkdir -p /home/cowrie/my-honeypot"
  - su - cowrie -c "cd /home/cowrie/my-honeypot && python3 -m venv cowrie-env"
  - su - cowrie -c "cd /home/cowrie/my-honeypot && source cowrie-env/bin/activate && pip install --upgrade pip && pip install cowrie"
  - su - cowrie -c "cd /home/cowrie/my-honeypot && source cowrie-env/bin/activate && cowrie init"
  - sed -i 's/^listen_endpoints = tcp:2222.*/listen_endpoints = tcp:22:interface=0.0.0.0/' /home/cowrie/my-honeypot/etc/cowrie.cfg
  - su - cowrie -c "cd /home/cowrie/my-honeypot && source cowrie-env/bin/activate && authbind --deep cowrie start"
