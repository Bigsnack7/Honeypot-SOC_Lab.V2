#cloud-config
runcmd:
  # Wait for any background apt lock (e.g. unattended-upgrades) to clear
  - |
    for i in $(seq 1 30); do
      if sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then
        sleep 10
      else
        break
      fi
    done
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y git python3-venv python3-dev libssl-dev libffi-dev build-essential authbind
  - useradd -m -s /bin/bash cowrie
  - mkdir -p /etc/authbind/byport
  - touch /etc/authbind/byport/22
  - chown cowrie:cowrie /etc/authbind/byport/22
  - chmod 770 /etc/authbind/byport/22
  - mkdir -p /etc/ssh/sshd_config.d
  - echo "Port 2222" > /etc/ssh/sshd_config.d/99-honeypot.conf
  - systemctl restart sshd
  - su - cowrie -c "git clone https://github.com/cowrie/cowrie.git /home/cowrie/cowrie"
  - su - cowrie -c "cd /home/cowrie/cowrie && python3 -m venv cowrie-env"
  - su - cowrie -c "cd /home/cowrie/cowrie && source cowrie-env/bin/activate && pip install --upgrade pip && pip install -r requirements.txt"
  - su - cowrie -c "cp /home/cowrie/cowrie/etc/cowrie.cfg.dist /home/cowrie/cowrie/etc/cowrie.cfg"
  - sed -i 's/^listen_endpoints = tcp:2222.*/listen_endpoints = tcp:22:interface=0.0.0.0/' /home/cowrie/cowrie/etc/cowrie.cfg
  - su - cowrie -c "cd /home/cowrie/cowrie && source cowrie-env/bin/activate && authbind --deep bin/cowrie start"

  
