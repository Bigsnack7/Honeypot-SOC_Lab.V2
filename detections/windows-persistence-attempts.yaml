id: 8f1e6c2a-3b4d-4a1e-9c7f-2d5e8a1b3c4d
name: Windows Honeypot - Persistence Attempt Detected
description: |
  Detects common Windows persistence techniques on the honeypot host, including
  new scheduled tasks (Event ID 4698), registry Run/RunOnce key writes (Sysmon
  Event ID 13), and new service installation (Event ID 4697). On a honeypot,
  any legitimate reason for these actions should not exist, so this rule treats
  a single match as high-confidence.
severity: High
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsSysmon
    dataTypes:
      - Event
queryFrequency: 10m
queryPeriod: 10m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
relevantTechniques:
  - T1053.005
  - T1547.001
  - T1543.003
query: |
  let ScheduledTasks = SecurityEvent
  | where EventID == 4698
  | project TimeGenerated, Computer, Account, Activity,
            TaskName = extract(@"Task Name:\s*(.+)", 1, EventData),
            Technique = "T1053.005 - Scheduled Task Created";
  let RunKeys = Event
  | where Source == "Microsoft-Windows-Sysmon" and EventID == 13
  | extend EvData = parse_xml(EventData).DataItem.EventData.Data
  | extend Image = tostring(EvData[5].["#text"]),
           TargetObject = tostring(EvData[6].["#text"]),
           Details = tostring(EvData[7].["#text"])
  | where TargetObject has_any (@"CurrentVersion\Run", @"CurrentVersion\RunOnce", @"CurrentVersion\RunServices")
  | project TimeGenerated, Computer, Image, TargetObject, Details,
            Technique = "T1547.001 - Registry Run Key";
  let NewServices = SecurityEvent
  | where EventID == 4697
  | project TimeGenerated, Computer, Account, Activity,
            ServiceName = extract(@"Service Name:\s*(.+)", 1, EventData),
            Technique = "T1543.003 - New Service Installed";
  ScheduledTasks
  | union RunKeys, NewServices
  | sort by TimeGenerated desc
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: FullName
        columnName: Computer
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: Account
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: false
alertGroupingEnabled: false
version: 1.0.0
kind: Scheduled
status: Disabled
